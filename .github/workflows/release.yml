name: release

# 打 tag（v1.0.0 这种）时：
#   1. 构建多架构镜像推到 ghcr.io/<owner>/crewgo
#   2. 在 Linux 上打好 .fpk 并附到 Release
# 注意：Docker 镜像名必须全小写。GitHub 用户名 JudeHaplin 直接拼进镜像名会被 Docker 拒绝
#      （invalid reference format: repository name must be lowercase），所以统一转成 judehaplin。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 计算镜像名（全小写）
        id: img
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/crewgo" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  fpk:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 计算镜像名与版本号
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/crewgo" >> "$GITHUB_OUTPUT"
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="$(node -p "require('./server/package.json').version")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 安装官方 fnpack
        run: |
          set -uo pipefail
          URL=https://static2.fnnas.com/fnpack/fnpack-1.3.3-linux-amd64
          ok=0
          for i in 1 2 3 4 5; do
            echo "第 $i 次尝试下载 fnpack"
            if curl -fSL --retry 3 --retry-all-errors --retry-delay 5 \
                 --connect-timeout 15 -m 300 -o fnpack "$URL"; then ok=1; break; fi
            echo "下载失败，10 秒后重试"
            sleep 10
          done
          if [ "$ok" != "1" ] || [ ! -s fnpack ]; then
            echo "::error::fnpack 下载失败（飞牛官方静态资源超时），请重新运行本工作流"
            exit 1
          fi
          chmod +x fnpack
          ./fnpack --help | head -3 || true
          sudo mv -f fnpack /usr/local/bin/fnpack
          fnpack --help | head -3

      - name: 打包 fpk
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER="${{ github.repository_owner }}" ./scripts/build-fpk.sh "${{ steps.vars.outputs.version }}"
          ls -lh dist/
          echo "--- 包内镜像名（必须全小写）---"
          grep -n 'image:' dist/fpk-src/app/docker/docker-compose.yaml

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.fpk
          generate_release_notes: true
          body: |
            ## 安装方式

            **飞牛 fnOS**：下载下面的 `.fpk`，在应用中心「手动安装」里选择它。装完打开应用，第一个进入的人创建统筹管理员账号。

            **Docker**：
            ```bash
            docker run -d --name crewgo \
              -p 8080:8080 -v $(pwd)/data:/data \
              --restart unless-stopped \
              ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version }}
            ```

            **拉不到镜像（unauthorized）**：GHCR 的容器包默认私有，到
            `github.com/users/<owner>/packages/container/crewgo/settings` 底部把可见性改成 Public；
            或先 `docker login ghcr.io`（令牌勾 `read:packages`）再拉。

            > 本 fpk 未签名（CI 用 `--nosign` 构建），飞牛可能提示未签名/未知来源，允许继续即可；上架应用中心需要官方开发者证书。
