name: release

# 打 tag（v1.0.0 这种）时：
#   1. 构建多架构镜像推到 ghcr.io/<owner>/crewgo
#   2. 在 Linux 上打好 .fpk 并附到 Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  fpk:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装官方 fnpack
        run: |
          curl -fsSL -o fnpack https://static2.fnnas.com/fnpack/fnpack-1.3.3-linux-amd64
          chmod +x fnpack
          sudo mv fnpack /usr/local/bin/fnpack
          fnpack --help | head -3

      - name: 打包 fpk
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="$(node -p "require('./server/package.json').version")"
          fi
          OWNER="${{ github.repository_owner }}" ./scripts/build-fpk.sh "$VERSION"
          ls -lh dist/

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.fpk
          generate_release_notes: true
          body: |
            ## 安装方式

            **飞牛 fnOS**：下载下面的 `.fpk`，在应用中心「手动安装」里选择它。装完打开应用，第一个进入的人创建统筹管理员账号。

            **Docker**：
            ```bash
            docker run -d --name crewgo \
              -p 8080:8080 -v $(pwd)/data:/data \
              --restart unless-stopped \
              ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```
            > 版本号去掉开头的 v，例如 `ghcr.io/${{ github.repository }}:1.0.0`

            > 本 fpk 未签名（CI 用 `--nosign` 构建）。飞牛可能提示未签名/未知来源，允许继续即可；正式上架应用中心需要开发者证书。
