name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 语法检查
        run: |
          node --check assets/app.js
          node --check assets/local-cloud.js
          node --check server/src/index.js
          node --check server/src/store.js
          node --check server/src/jobs.js

      - name: 接口与适配层测试
        run: node --no-warnings server/test/run.js

      - name: 构建镜像
        run: docker build -t crewgo:ci .
