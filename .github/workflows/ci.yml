name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 语法检查
        run: |
          node --check assets/app.js
          node --check assets/local-cloud.js
          node --check server/src/index.js
          node --check server/src/store.js
          node --check server/src/jobs.js

      - name: 接口与适配层测试
        run: |
          rm -rf .data
          DATA_DIR=./.data PORT=8099 node --no-warnings server/src/index.js &
          sleep 3
          node --no-warnings server/test/api-smoke.js
          node --no-warnings server/test/client-shim.js
          kill %1

      - name: 构建镜像
        run: docker build -t repair-scheduler:ci .
