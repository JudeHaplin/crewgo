services:
  repair-scheduler:
    image: ghcr.io/{{OWNER}}/repair-scheduler:{{VERSION}}
    container_name: repair-scheduler
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
      - PORT=8080
      - DIGEST_HOUR=8
    volumes:
      - "${TRIM_PKGVAR}/data:/data"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
