services:
  crewgo:
    # 注意：Docker 镜像名必须全小写（打包脚本会把用户名转小写后填进这一行，模板里别写死大写）
    image: {{IMAGE}}:{{VERSION}}
    container_name: crewgo
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
      - PORT=8080
      - DIGEST_HOUR=8
    volumes:
      - "${TRIM_PKGVAR}/data:/data"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
