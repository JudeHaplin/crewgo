services:
  crewgo:
    image: crewgo:1.0.0
    build: .
    container_name: crewgo
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      PORT: "8080"
      DIGEST_HOUR: "8"          # 每天几点发派单汇总邮件
    volumes:
      - ./data:/data            # 数据库和密钥都在这，别删
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
